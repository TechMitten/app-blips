# Cloudflare Worker for the AppBlips LLM proxy + AI relays.
# Secrets are NOT stored here — set them with `wrangler secret put`.

name = "appblips-api"
main = "worker/index.js"
compatibility_date = "2024-11-01"

# Public values (safe to commit). Fill in your real model name.
[vars]
OPENAI_LLM_MODEL = "deepseek/deepseek-v4-pro"

# Secrets (run these once, they're stored encrypted by Cloudflare):
#   npx wrangler secret put APPBLIPS_OPENROUTER_API_KEY
