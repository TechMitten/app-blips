<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Only directives that are safe to inherit. A srcdoc iframe inherits the
         embedder's CSP and sandboxing does not sever that, so any script-src
         here would kill the generated app's inline scripts and the Tailwind CDN
         (and script-src 'self' would additionally break the dev server, whose
         React-Refresh preamble is inlined). frame-ancestors is ignored in a
         meta tag -- it is set as a real header in vite.config.js. -->
    <meta http-equiv="Content-Security-Policy" content="base-uri 'none'; object-src 'none'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Orion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
