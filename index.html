<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Only directives that are safe to inherit. A srcdoc iframe inherits the
         embedder's CSP and sandboxing does not sever that, so any script-src
         here would kill the generated app's inline scripts and the Tailwind CDN
         (and script-src 'self' would additionally break the dev server, whose
         React-Refresh preamble is inlined). frame-ancestors is ignored in a
         meta tag -- it is set as a real header in vite.config.js. -->
    <meta http-equiv="Content-Security-Policy" content="base-uri 'none'; object-src 'none'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- Resolve the theme before first paint so there is no light flash.
         Inline is required (it must run before the deferred module bundle);
         the meta CSP above sets no script-src, so inline scripts are allowed.
         Kept in sync with THEME_KEY / THEME_META_COLOR in src/App.jsx. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('orion-theme');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#10131c' : '#f8fafc');
        } catch (e) {
          /* storage blocked -- fall through to the light default */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Orion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
