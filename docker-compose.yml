services:
  appblips:
    build:
      context: .
      args:
        APPBLIPS_GENERATED_AI_MODE: ${APPBLIPS_GENERATED_AI_MODE:-relay}
        APPBLIPS_APP_AI_RELAY_URL: ${APPBLIPS_APP_AI_RELAY_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - SELF_HOSTED_MODE=true
    restart: unless-stopped
