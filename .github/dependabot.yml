version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates only: 0 turns off routine version-bump PRs.
    open-pull-requests-limit: 0
    # The fixtures are sample customer projects frozen at older versions for
    # the codebase import tests; they never ship or run as real sites.
    exclude-paths:
      - "testing/fixtures/**"
