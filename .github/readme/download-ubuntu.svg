<svg xmlns="http://www.w3.org/2000/svg" width="300" height="92" viewBox="0 0 300 92" role="img" aria-label="Download for Ubuntu">
  <title>Download for Ubuntu</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77216F"/>
      <stop offset="0.5" stop-color="#C7362B"/>
      <stop offset="1" stop-color="#FF7A2E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E95420"/>
      <stop offset="1" stop-color="#C7362B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#E95420" flood-opacity="0.5"/>
    </filter>
    <clipPath id="clip"><rect x="10" y="8" width="280" height="68" rx="18"/></clipPath>
  </defs>
  <style>
    .shine { animation: sweep 4.5s cubic-bezier(.22,1,.36,1) infinite; animation-delay: 0.6s; transform: translateX(-140px) skewX(-20deg); }
    .arrow { animation: bob 1.8s ease-in-out infinite; animation-delay: 0.3s; }
    .friends { transform-origin: 46px 42px; animation: spin 14s linear infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-140px) skewX(-20deg); } 100% { transform: translateX(420px) skewX(-20deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(2px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .shine, .arrow, .friends { animation: none; } }
    text { font-family: Ubuntu, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
  </style>

  <g filter="url(#glow)">
    <rect x="10" y="8" width="280" height="68" rx="18" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="10" y="8" width="280" height="68" fill="url(#gloss)"/>
    <circle cx="262" cy="-6" r="56" fill="#fff" opacity="0.07"/>
    <circle cx="300" cy="80" r="40" fill="#fff" opacity="0.06"/>
    <rect class="shine" x="0" y="0" width="70" height="92" fill="url(#shine)"/>
  </g>
  <rect x="10.5" y="8.5" width="279" height="67" rx="17.5" fill="none" stroke="#fff" stroke-opacity="0.28"/>

  <!-- Ubuntu "circle of friends" on a white tile, turning slowly -->
  <rect x="22" y="18" width="48" height="48" rx="13" fill="#fff"/>
  <g class="friends">
    <circle cx="46" cy="42" r="10.5" fill="none" stroke="url(#logo)" stroke-width="3.6"
            stroke-dasharray="16 6" stroke-dashoffset="19"/>
    <circle cx="59.4" cy="42" r="3.6" fill="#E95420"/>
    <circle cx="39.3" cy="30.4" r="3.6" fill="#E95420"/>
    <circle cx="39.3" cy="53.6" r="3.6" fill="#E95420"/>
  </g>

  <text x="84" y="37" font-size="11" font-weight="600" letter-spacing="1.6" opacity="0.85">DOWNLOAD FOR</text>
  <text x="83" y="62" font-size="25" font-weight="700" letter-spacing="-0.3">Ubuntu</text>

  <!-- download arrow -->
  <circle cx="258" cy="42" r="17" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.35"/>
  <g class="arrow" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 34v14M252 42.5l6 6 6-6"/>
    <path d="M251 51.5h14" stroke-opacity="0.8"/>
  </g>
</svg>
