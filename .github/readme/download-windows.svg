<svg xmlns="http://www.w3.org/2000/svg" width="300" height="92" viewBox="0 0 300 92" role="img" aria-label="Download for Windows">
  <title>Download for Windows</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2FA8"/>
      <stop offset="0.55" stop-color="#0067E0"/>
      <stop offset="1" stop-color="#16B4FF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0050EF"/>
      <stop offset="1" stop-color="#3CC8FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0067E0" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip"><rect x="10" y="8" width="280" height="68" rx="18"/></clipPath>
  </defs>
  <style>
    .shine { animation: sweep 4.5s cubic-bezier(.22,1,.36,1) infinite; }
    .arrow { animation: bob 1.8s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-140px) skewX(-20deg); } 100% { transform: translateX(420px) skewX(-20deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(2px); } }
    @media (prefers-reduced-motion: reduce) { .shine, .arrow { animation: none; } }
    text { font-family: 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
  </style>

  <g filter="url(#glow)">
    <rect x="10" y="8" width="280" height="68" rx="18" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="10" y="8" width="280" height="68" fill="url(#gloss)"/>
    <circle cx="262" cy="-6" r="56" fill="#fff" opacity="0.07"/>
    <circle cx="300" cy="80" r="40" fill="#fff" opacity="0.06"/>
    <rect class="shine" x="0" y="0" width="70" height="92" fill="url(#shine)"/>
  </g>
  <rect x="10.5" y="8.5" width="279" height="67" rx="17.5" fill="none" stroke="#fff" stroke-opacity="0.28"/>

  <!-- Windows logo on a white tile -->
  <rect x="22" y="18" width="48" height="48" rx="13" fill="#fff"/>
  <g transform="translate(33 29)" fill="url(#logo)">
    <rect x="0" y="0" width="12.4" height="12.4" rx="1.2"/>
    <rect x="13.6" y="0" width="12.4" height="12.4" rx="1.2"/>
    <rect x="0" y="13.6" width="12.4" height="12.4" rx="1.2"/>
    <rect x="13.6" y="13.6" width="12.4" height="12.4" rx="1.2"/>
  </g>

  <text x="84" y="37" font-size="11" font-weight="600" letter-spacing="1.6" opacity="0.85">DOWNLOAD FOR</text>
  <text x="83" y="62" font-size="25" font-weight="700" letter-spacing="-0.3">Windows</text>

  <!-- download arrow -->
  <circle cx="258" cy="42" r="17" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.35"/>
  <g class="arrow" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 34v14M252 42.5l6 6 6-6"/>
    <path d="M251 51.5h14" stroke-opacity="0.8"/>
  </g>
</svg>
