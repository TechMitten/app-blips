name: Desktop

# Builds the desktop installers on each OS natively: Windows NSIS (.exe) on
# windows-latest, AppImage + .deb on ubuntu-latest. Run it by hand from the
# Actions tab, or push a tag like v0.1.0 to also attach them to a draft
# GitHub Release (bump "version" in package.json to match first).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: appblips-desktop-${{ runner.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
