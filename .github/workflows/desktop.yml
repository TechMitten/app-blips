name: Desktop

# Builds the Linux desktop installers (AppImage + .deb) on ubuntu-latest. Run
# it by hand from the Actions tab, or push a tag like v0.1.0 to also publish
# them as a draft GitHub Release (bump "version" in package.json to match
# first). Publishing that draft is what rolls the update out: installed
# AppImage builds check the latest published release, using the latest*.yml
# file uploaded alongside. Windows is distributed only through the Microsoft
# Store, built by hand (see RELEASING.md) — this workflow never touches it.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist
      - name: Write SHA-256 checksums
        run: |
          cd dist-desktop
          : > SHA256SUMS.txt
          for f in *.AppImage *.deb; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
            dist-desktop/SHA256SUMS.txt
