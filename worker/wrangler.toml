# The online, multi-user side of AppBlips (see index.js). Deploy from this
# folder: npx wrangler deploy. Secrets (Creem, Render, the AI provider key) are
# set with `npx wrangler secret put NAME` and never live in this file.
name = "appblips-api"
main = "index.js"
compatibility_date = "2026-10-01"
# Buffer and node:crypto/node:path for Clerk token checks, Creem signatures
# and the sandbox's tar uploads.
compatibility_flags = ["nodejs_compat"]

# auth.appblips.com: the desktop app's browser sign-in page (desktopAuth.js)
# must be on an appblips.com address, since Clerk's production instance
# refuses other origins. Deploying creates its DNS record and certificate.
# The workers.dev address stays for the API the desktop app already uses.
workers_dev = true
routes = [{ pattern = "auth.appblips.com", custom_domain = true }]

[vars]
# The desktop app's own origin; it calls this Worker from there.
APPBLIPS_CHAT_ALLOWED_ORIGINS = "appblips://app"
CREEM_SERVER = "prod"
# DeepSeek (the server's default provider) runs paid chat; its key is the
# OPENAI_API_KEY secret. Model names aren't secret, so they live here.
OPENAI_LLM_MODEL = "deepseek-flash"
APPBLIPS_MODEL_BASIC = "deepseek-flash"

[[d1_databases]]
binding = "DB"
database_name = "appblips"
database_id = "c910bde3-a443-453a-b4cf-6dca0c7408a4"
migrations_dir = "migrations"

[observability]
enabled = true
